[package]
name    = "auth-service"
version = "0.1.0"
edition = "2021"

# Library crate — expose router() untuk rejki-app (Composition Root)
[lib]
name = "auth_service"
path = "src/lib.rs"

# Binary standalone — untuk saat diekstrak jadi microservice terpisah
[[bin]]
name = "auth-service"
path = "src/main.rs"

[dependencies]
common-errors  = { workspace = true }
common-tracing = { workspace = true }
common-auth-mw = { workspace = true }
