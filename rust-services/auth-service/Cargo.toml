common-rate-limit = { workspace = true }
auth-service-client = { path = "../auth-service-client" }
notification-service-client = { path = "../notification-service-client" }
storage-service-client = { path = "../storage-service-client" }
user-service-client = { path = "../user-service-client" }
common-idempotency = { workspace = true }
common-config     = { workspace = true }

axum        = { workspace = true }
tokio       = { workspace = true }
sqlx        = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
uuid        = { workspace = true }
chrono      = { workspace = true }
tracing     = { workspace = true }
tower-http  = { workspace = true }
thiserror   = { workspace = true }
validator   = { workspace = true }
