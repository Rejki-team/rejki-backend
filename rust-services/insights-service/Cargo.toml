[package]
name    = "insights-service"
version = "0.1.0"
edition = "2021"

[lib]
name = "insights_service"
path = "src/lib.rs"

[[bin]]
name = "insights-service"
path = "src/main.rs"

[dev-dependencies]
auth-service = { path = "../auth-service" }
tower        = { workspace = true }
dotenvy      = { workspace = true }
bcrypt       = { workspace = true }
serde_json   = { workspace = true }

[dependencies]
common-errors  = { workspace = true }
common-tracing = { workspace = true }
common-auth-mw = { workspace = true }
auth-service-client = { path = "../auth-service-client" }

axum        = { workspace = true }
tokio       = { workspace = true, features = ["full"] }
sqlx        = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
uuid        = { workspace = true }
chrono      = { workspace = true }
tracing     = { workspace = true }
thiserror   = { workspace = true }
anyhow      = { workspace = true }
