[package]
name    = "rejki-app"
version = "0.1.0"
edition = "2021"

# Composition Root — satu-satunya tempat yang tahu semua service konkret.
# Wire semua dependency di sini, lalu gabungkan semua router.
[[bin]]
name = "rejki-app"
path = "src/main.rs"

[dependencies]
common-config  = { workspace = true }
common-errors  = { workspace = true }
common-tracing = { workspace = true }

# Import SERVICE (implementasi), bukan client (trait/kontrak).
# Client hanya dipakai oleh service yang mengkonsumsi service lain.
# Pengecualian: *-client dipakai untuk type annotation Arc<dyn ...Client>.
auth-service-client         = { path = "../auth-service-client" }
notification-service-client = { path = "../notification-service-client" }
auth-service                = { path = "../auth-service" }
user-service                = { path = "../user-service" }
chat-service                = { path = "../chat-service" }
notification-service        = { path = "../notification-service" }
iklan-pekerjaan-service     = { path = "../iklan-pekerjaan-service" }
iklan-pekerja-service       = { path = "../iklan-pekerja-service" }
iklan-barang-bekas-service  = { path = "../iklan-barang-bekas-service" }
iklan-pelatihan-service     = { path = "../iklan-pelatihan-service" }
region-service              = { path = "../region-service" }
region-service-client       = { path = "../region-service-client" }
storage-service             = { path = "../storage-service" }
storage-service-client      = { path = "../storage-service-client" }

axum        = { workspace = true }
tokio       = { workspace = true }
tower-http  = { workspace = true }
tracing     = { workspace = true }
sqlx        = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }

# OpenAPI / Swagger UI — hanya di-mount saat APP_ENV=development.
utoipa             = { workspace = true }
utoipa-swagger-ui  = { workspace = true }

[dev-dependencies]
tower       = { version = "0.5", features = ["util"] }
dotenvy     = { workspace = true }
bcrypt      = { workspace = true }
uuid        = { workspace = true }
