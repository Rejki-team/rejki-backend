# ─────────────────────────────────────────────────────────────────────────────
# Rejki Backend — nginx production config
# HTTPS ditangani Cloudflare Tunnel — nginx hanya listen 80 (internal).
# Cloudflare → Tunnel → nginx:80 → upstream service
# ─────────────────────────────────────────────────────────────────────────────

upstream rejki_app {
    server rejki-app:8080;
    keepalive 64;
}

# ── Rate limiting zones ───────────────────────────────────────────────────────
# 10 req/s per IP untuk endpoint umum
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
# 3 req/s per IP untuk endpoint auth (login, register, otp)
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=3r/s;
# 1 req/s per IP untuk endpoint sensitif (forgot-password)
limit_req_zone $binary_remote_addr zone=strict_limit:10m rate=1r/s;

server {
    listen 80;
    server_name _;

    # ── Logging ──────────────────────────────────────────────────────────────
    # Format JSON untuk structured logging
    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"method":"$request_method",'
            '"uri":"$uri",'           # $uri bukan $request — tidak ada query string
            '"status":$status,'
            '"bytes":$body_bytes_sent,'
            '"duration":$request_time,'
            '"ip":"$http_x_forwarded_for",'
            '"ua":"$http_user_agent"'
        '}';

    access_log /var/log/nginx/access.log json_combined;
    error_log  /var/log/nginx/error.log  warn;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"                           always;
    add_header X-Frame-Options         "DENY"                              always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin"   always;
    add_header Permissions-Policy      "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    # Sembunyikan versi nginx
    server_tokens off;

    # ── Limits ───────────────────────────────────────────────────────────────
    client_max_body_size    10m;
    client_body_timeout     10s;
    client_header_timeout   10s;
    keepalive_timeout       65s;
    send_timeout            10s;

    # ── Health check (no auth, no log, no rate limit) ─────────────────────────
    location = /health {
        access_log off;
        proxy_pass         http://rejki_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $http_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 3s;
        proxy_read_timeout    5s;
    }

    # ── WebSocket — chat ──────────────────────────────────────────────────────
    # PENTING: access_log off — URL mengandung ?token= query param
    location /api/v1/chat/ws {
        access_log off;

        # Rate limit: max 5 koneksi WS baru per detik per IP
        limit_req zone=api_limit burst=5 nodelay;

        proxy_pass         http://rejki_app;
        proxy_http_version 1.1;

        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $http_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;

        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_connect_timeout 5s;
    }

    # ── Auth endpoints — rate limit ketat ────────────────────────────────────
    location ~ ^/api/v1/auth/(login|register|resend-otp) {
        limit_req zone=auth_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass         http://rejki_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $http_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header   Connection        "";
        proxy_connect_timeout 5s;
        proxy_read_timeout    15s;
        proxy_send_timeout    15s;
    }

    # ── REST API umum ─────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass         http://rejki_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $http_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header   Connection        "";
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;

        # Gzip untuk response besar
        gzip              on;
        gzip_types        application/json;
        gzip_min_length   1024;
    }

    # ── Custom error responses ────────────────────────────────────────────────
    error_page 429 @too_many_requests;
    location @too_many_requests {
        default_type application/json;
        return 429 '{"error":"RATE_LIMITED","message":"terlalu banyak request, coba beberapa saat lagi"}';
    }

    error_page 502 503 504 @upstream_error;
    location @upstream_error {
        default_type application/json;
        return 503 '{"error":"SERVICE_UNAVAILABLE","message":"layanan sedang tidak tersedia"}';
    }

    # ── Block semua path lain ─────────────────────────────────────────────────
    location / {
        return 404 '{"error":"NOT_FOUND","message":"endpoint tidak ditemukan"}';
        add_header Content-Type application/json always;
    }
}
