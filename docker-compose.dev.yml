# ─────────────────────────────────────────────────────────────────────────────
# Rejki Backend — Dev Environment
# Service images di-push ke GHCR oleh GitHub Actions CI
# Server hanya pull & up -d
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── Rejki App (Rust — Modular Monolith) ────────────────────────────────────
  rejki-app:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-rejki}/rejki-backend:develop
    container_name: rejki-app-dev
    restart: unless-stopped
    # depends_on postgres & redis ada di docker-compose.infra.yml (project terpisah)
    # — container connect via shared network rejki-infra
    environment:
      APP_ENV:               development
      DATABASE_URL:          postgres://rejki:${POSTGRES_PASSWORD:?err_PGPASSWORD_wajib_di_set}@postgres:5432/rejki_dev
      DATABASE_POOL_SIZE:    ${DATABASE_POOL_SIZE:-10}
      REDIS_URL:             redis://redis:6379/0
      APP_PORT:              8080
      CORS_ALLOWED_ORIGINS:  ${DEV_CORS_ORIGINS:-http://dev.rejki.id}
      JWT_PRIVATE_KEY_PATH:  /app/keys/private.pem
      JWT_PUBLIC_KEY_PATH:   /app/keys/public.pem
      JWT_ACCESS_TTL_SECS:   ${JWT_ACCESS_TTL_SECS:-900}
      JWT_REFRESH_TTL_SECS:  ${JWT_REFRESH_TTL_SECS:-2592000}
      DATA_ENCRYPTION_KEY:   ${DATA_ENCRYPTION_KEY}
      RUST_LOG:              ${RUST_LOG:-debug}
      MINIO_ENDPOINT:        http://minio:9000
      MINIO_ACCESS_KEY:      ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY:      ${MINIO_SECRET_KEY}
      MINIO_BUCKET:          rejki-dokumen-dev
      CLAMAV_HOST:           clamav-daemon
      CLAMAV_PORT:           3310
      OTEL_SERVICE_NAME:     rejiki-backend-dev
      OTEL_EXPORTER_OTLP_ENDPOINT: http://rejki-otel-collector:4317
      OTEL_EXPORTER_OTLP_HEADERS:  ${OTEL_EXPORTER_OTLP_HEADERS:-}
    volumes:
      - /opt/rejki/keys:/app/keys:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - rejki-infra
      - rejki-dev

  # ── Bun Notification Service ───────────────────────────────────────────────
  bun-notification:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-rejki}/rejki-backend-notification:develop
    container_name: rejki-bun-dev
    restart: unless-stopped
    # depends_on postgres & redis ada di docker-compose.infra.yml (project terpisah)
    environment:
      APP_ENV:                      development
      REDIS_URL:                    redis://redis:6379/0
      DATABASE_URL:                 postgres://rejki:${POSTGRES_PASSWORD:?err_PGPASSWORD_wajib_di_set}@postgres:5432/rejki_dev
      FIREBASE_SERVICE_ACCOUNT_PATH: /app/keys/firebase-service-account-dev.json
      FIREBASE_PROJECT_ID:          ${FIREBASE_PROJECT_ID_DEV}
      SMTP_HOST:                    ${SMTP_HOST:-smtp.mailtrap.io}
      SMTP_PORT:                    ${SMTP_PORT:-587}
      SMTP_USERNAME:                ${SMTP_USERNAME_DEV}
      SMTP_PASSWORD:                ${SMTP_PASSWORD_DEV}
      EMAIL_FROM:                   ${EMAIL_FROM:-Rejki Dev <noreply@dev.rejki.id>}
      PORT:                         9000
    volumes:
      - /opt/rejki/keys:/app/keys:ro
    expose:
      - "9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    networks:
      - rejki-infra
      - rejki-dev

  # ── Rejki Web (Vue 3 Frontend) ────────────────────────────────────────────
  rejki-web:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-rejki}/rejki-web:develop
    container_name: rejki-web-dev
    restart: unless-stopped
    depends_on:
      - rejki-app
    expose:
      - "80"
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M
    networks:
      - rejki-dev

  # ── Nginx (Reverse Proxy) — DEV ────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: rejki-nginx-dev
    restart: unless-stopped
    depends_on:
      - rejki-app
      - rejki-web
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8081:80"
    deploy:
      resources:
        limits:
          memory: 32M
        reservations:
          memory: 16M
    networks:
      - rejki-dev

  # ── Cloudflare Tunnel (DEV) ────────────────────────────────────────────────
  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: rejki-tunnel-dev
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?err}
    depends_on:
      - nginx
    networks:
      - rejki-dev

networks:
  rejki-infra:
    name: rejki-infra
    external: true
  rejki-dev:
    name: rejki-dev
    driver: bridge
