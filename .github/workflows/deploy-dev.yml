name: Deploy to Dev

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy-dev:
    name: Deploy to VPS (dev)
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4

      - name: Deploy dev via SSH
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          port:     ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e

            cd /opt/rejki/dev/rejki-backend

            echo "==> Pull latest develop"
            git pull origin develop

            echo "==> Run database migrations (dev)"
            cd rust-services
            export DATABASE_URL="postgres://rejki:${POSTGRES_PASSWORD}@postgres:5432/rejki_dev"
            # Map service → schema
            map_schema() {
              case "$1" in
                user-service)            echo "user_svc" ;;
                corporate-comms-service) echo "comms" ;;
                *)                       echo "$1" | sed 's/-service//' | sed 's/-/_/g' ;;
              esac
            }
            for dir in *-service/migrations; do
              svc=$(basename "$(dirname "$dir")")
              schema=$(map_schema "$svc")
              psql "$DATABASE_URL" -c "CREATE SCHEMA IF NOT EXISTS $schema" 2>/dev/null
              sqlx migrate run --source "$dir" --database-url "$DATABASE_URL"
            done
            cd ..

            echo "==> Pull base images"
            docker compose -f docker-compose.dev.yml -p rejki-dev pull

            echo "==> Build dev images"
            docker compose -f docker-compose.dev.yml -p rejki-dev build

            echo "==> Restart dev services"
            docker compose -f docker-compose.dev.yml -p rejki-dev up -d

            echo "==> Wait for health check"
            sleep 10
            docker compose -f docker-compose.dev.yml -p rejki-dev ps

            echo "==> Verify /health endpoint"
            curl -sf http://localhost:8081/health || (echo "Dev health check failed!" && exit 1)

            echo "==> Cleanup old images"
            docker image prune -f

            echo "==> Dev deploy complete"
