name: Deploy to Dev

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  COMPOSE_FILE: docker-compose.dev.yml

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy-dev:
    name: Deploy to VPS (dev)
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4

      - name: Copy deploy config to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          port:     ${{ secrets.VPS_PORT || 22 }}
          source:   "docker-compose.dev.yml,nginx.dev.conf"
          target:   "/opt/rejki/dev/"
          strip_components: 0
          overwrite: true

      - name: Deploy & restart via SSH
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          port:     ${{ secrets.VPS_PORT || 22 }}
          # Tunggu 30 menit agar CI (docker-build) selesai push image ke GHCR
          command_timeout: 35m
          script: |
            set -e
            cd /opt/rejki/dev

            # Rename nginx config
            [ -f nginx.dev.conf ] && mv -f nginx.dev.conf nginx.conf

            echo "==> Login to GitHub Container Registry"
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "==> Menunggu CI selesai push image (max 25 menit)..."
            for i in $(seq 1 30); do
              IMG="ghcr.io/rejki-team/rejki-backend:develop"
              if docker manifest inspect "$IMG" >/dev/null 2>&1; then
                echo "✅ Image $IMG tersedia!"
                break
              fi
              echo "⏳ Menunggu image... ($i/30)"
              sleep 60
            done

            echo "==> Pull latest backend images"
            docker compose -f docker-compose.dev.yml --env-file .env pull rejki-app bun-notification

            echo "==> Restart backend services"
            docker compose -f docker-compose.dev.yml --env-file .env up -d rejki-app bun-notification

            echo "==> Verify health check"
            sleep 10
            docker compose -f docker-compose.dev.yml ps
            curl -sf http://localhost:8081/health || (echo "❌ Dev health check failed!" && exit 1)

            echo "==> Prune old images"
            docker image prune -f

            echo "✅ Dev deploy complete"
