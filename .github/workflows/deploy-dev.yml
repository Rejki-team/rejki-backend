name: Deploy to Dev

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy-dev:
    name: Deploy to VPS (dev)
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4

      - name: Copy deploy config to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          port:     ${{ secrets.VPS_PORT || 22 }}
          source:   "docker-compose.dev.yml,nginx.dev.conf"
          target:   "/opt/rejki/dev/"
          strip_components: 0
          overwrite: true

      - name: Rename & restart via SSH
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          port:     ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e

            cd /opt/rejki/dev

            echo "==> Rename config files"
            [ -f docker-compose.dev.yml ] && mv docker-compose.dev.yml docker-compose.yml
            [ -f nginx.dev.conf ] && mv nginx.dev.conf nginx.conf

            echo "==> Login to GitHub Container Registry"
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "==> Pull latest images"
            docker compose pull

            echo "==> Restart services"
            docker compose up -d

            echo "==> Verify health check"
            sleep 10
            docker compose ps
            curl -sf http://localhost:8081/health || (echo "❌ Dev health check failed!" && exit 1)

            echo "==> Prune old images"
            docker image prune -f

            echo "✅ Dev deploy complete"
