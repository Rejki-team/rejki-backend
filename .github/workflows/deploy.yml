name: Deploy to Production

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  COMPOSE_FILE: docker-compose.prod.yml

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS (prod)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Copy deploy config to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          port:     ${{ secrets.VPS_PORT || 22 }}
          source:   "docker-compose.prod.yml,nginx.prod.conf"
          target:   "/opt/rejki/prod/"
          strip_components: 0
          overwrite: true

      - name: Deploy & restart via SSH
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          port:     ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 35m
          script: |
            set -e
            cd /opt/rejki/prod

            [ -f nginx.prod.conf ] && mv -f nginx.prod.conf nginx.conf && echo "nginx.conf updated"

            echo "==> Login to GitHub Container Registry"
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "==> Menunggu CI selesai push image (max 25 menit)..."
            for i in $(seq 1 30); do
              IMG="ghcr.io/rejki-team/rejki-backend:main"
              if docker manifest inspect "$IMG" >/dev/null 2>&1; then
                echo "✅ Image $IMG tersedia!"
                break
              fi
              echo "⏳ Menunggu image... ($i/30)"
              sleep 60
            done

            echo "==> Pull latest backend images"
            docker compose -f docker-compose.prod.yml --env-file .env pull rejki-app bun-notification db-backup

            echo "==> Restart backend services"
            docker compose -f docker-compose.prod.yml --env-file .env up -d rejki-app bun-notification

            echo "==> Verify health check"
            sleep 10
            docker compose -f docker-compose.prod.yml ps
            curl -sf http://localhost:8082/health || (echo "❌ Health check failed!" && exit 1)

            echo "==> Run database migrations"
            docker compose -f docker-compose.prod.yml --env-file .env exec -T rejki-app /app/rejki-app migrate 2>/dev/null || \
              echo "⚠️  No built-in migrate command — run sqlx manually if needed"

            echo "==> Prune old images"
            docker image prune -f

            echo "✅ Prod deploy complete"
