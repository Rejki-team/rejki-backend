name: Deploy to Production

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS (prod)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          port:     ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e

            cd /opt/rejki/prod/rejki-backend

            echo "==> Pull latest main"
            git pull origin main

            echo "==> Run database migrations (prod)"
            cd rust-services
            export DATABASE_URL="postgres://rejki:${POSTGRES_PASSWORD}@postgres:5432/rejki_prod"
            map_schema() {
              case "$1" in
                user-service)            echo "user_svc" ;;
                corporate-comms-service) echo "comms" ;;
                *)                       echo "$1" | sed 's/-service//' | sed 's/-/_/g' ;;
              esac
            }
            for dir in *-service/migrations; do
              svc=$(basename "$(dirname "$dir")")
              schema=$(map_schema "$svc")
              psql "$DATABASE_URL" -c "CREATE SCHEMA IF NOT EXISTS $schema" 2>/dev/null
              sqlx migrate run --source "$dir" --database-url "$DATABASE_URL"
            done
            cd ..

            echo "==> Build prod images"
            docker compose -f docker-compose.prod.yml -p rejki-prod build

            echo "==> Restart prod services (with cloudflare tunnel)"
            docker compose -f docker-compose.prod.yml -p rejki-prod --profile prod up -d

            echo "==> Wait for health check"
            sleep 10
            docker compose -f docker-compose.prod.yml -p rejki-prod ps

            echo "==> Verify /health endpoint"
            curl -sf http://localhost:8082/health || (echo "Prod health check failed!" && exit 1)

            echo "==> Cleanup old images"
            docker image prune -f

            echo "==> Prod deploy complete"
