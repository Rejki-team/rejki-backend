name: CI + Deploy

on:
  push:
    branches: [develop, main]
  schedule:
    # Weekly: setiap Senin jam 06:00 UTC — cargo audit + cargo deny
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/rejki-backend

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Check: format + clippy + build ───────────────────────────────────────
  check:
    name: Check (fmt + clippy + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-services
          cache-on-failure: true

      - name: Check formatting
        working-directory: rust-services
        run: cargo fmt --all -- --check

      - name: Clippy (warnings as errors)
        working-directory: rust-services
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build workspace (dev profile)
        working-directory: rust-services
        run: cargo build --workspace

  # ── Unit tests (tanpa DB) ─────────────────────────────────────────────────
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-services
          cache-on-failure: true

      - name: Run unit tests (lib only — tanpa integration tests)
        working-directory: rust-services
        run: cargo test --workspace --lib
        env:
          APP_ENV: development

  # ── Bun check (notification service) ──────────────────────────────────────
  bun-check:
    name: Bun Check (notification service)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: bun-notification-service
        run: bun install --frozen-lockfile

      - name: Run tests
        working-directory: bun-notification-service
        run: bun run test

  # ── Docker build & push ──────────────────────────────────────────────────
  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [check, unit-test, bun-check]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GHCR HANYA terima lowercase — "Rejki-team" → "rejki-team"
      - name: Lowercase owner
        id: lc
        run: echo "owner=${OWNER,,}" >> $GITHUB_OUTPUT
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.lc.outputs.owner }}/rejki-backend
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push rejki-app image
        uses: docker/build-push-action@v5
        with:
          context: ./rust-services
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push bun-notification image
        uses: docker/build-push-action@v5
        with:
          context: ./bun-notification-service
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.lc.outputs.owner }}/rejki-backend-notification:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy Dev (develop only) ─────────────────────────────────────────────
  deploy-dev:
    name: Deploy to VPS (dev)
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/develop'
    environment: development
    steps:
      - uses: actions/checkout@v4

      - name: Copy deploy config to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          port:     ${{ secrets.VPS_PORT || 22 }}
          source:   "docker-compose.dev.yml,nginx.dev.conf"
          target:   "/opt/rejki/dev/"
          strip_components: 0
          overwrite: true

      - name: Deploy & restart via SSH
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          port:     ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd /opt/rejki/dev

            [ -f nginx.dev.conf ] && mv -f nginx.dev.conf nginx.conf

            echo "==> Login to GitHub Container Registry"
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "==> Pull latest backend images"
            docker compose -f docker-compose.dev.yml --env-file .env pull rejki-app bun-notification

            echo "==> Restart backend services"
            docker compose -f docker-compose.dev.yml --env-file .env up -d rejki-app bun-notification

            echo "==> Verify health check"
            sleep 10
            docker compose -f docker-compose.dev.yml ps
            curl -sf http://localhost:8081/health || (echo "❌ Dev health check failed!" && exit 1)

            echo "==> Prune old images"
            docker image prune -f

            echo "✅ Dev deploy complete"

  # ── Deploy Prod (main only) ──────────────────────────────────────────────
  deploy-prod:
    name: Deploy to VPS (prod)
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Copy deploy config to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          port:     ${{ secrets.VPS_PORT || 22 }}
          source:   "docker-compose.prod.yml,nginx.prod.conf"
          target:   "/opt/rejki/prod/"
          strip_components: 0
          overwrite: true

      - name: Deploy & restart via SSH
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          port:     ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd /opt/rejki/prod

            [ -f nginx.prod.conf ] && mv -f nginx.prod.conf nginx.conf && echo "nginx.conf updated"

            echo "==> Login to GitHub Container Registry"
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "==> Pull latest backend images"
            docker compose -f docker-compose.prod.yml --env-file .env pull rejki-app bun-notification db-backup

            echo "==> Restart backend services"
            docker compose -f docker-compose.prod.yml --env-file .env up -d rejki-app bun-notification

            echo "==> Verify health check"
            sleep 10
            docker compose -f docker-compose.prod.yml ps
            curl -sf http://localhost:8082/health || (echo "❌ Health check failed!" && exit 1)

            echo "==> Run database migrations"
            docker compose -f docker-compose.prod.yml --env-file .env exec -T rejki-app /app/rejki-app migrate 2>/dev/null || \
              echo "⚠️  No built-in migrate command — run sqlx manually if needed"

            echo "==> Prune old images"
            docker image prune -f

            echo "✅ Prod deploy complete"

  # ── Coverage (cargo-llvm-cov, lib-only, tanpa DB) ──────────────────────────
  coverage:
    name: Coverage (lib-only)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-services
          cache-on-failure: true

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run coverage (lib only)
        working-directory: rust-services
        run: cargo llvm-cov --workspace --lib --lcov --output-path lcov.info
        env:
          APP_ENV: development

      - name: Report coverage summary
        run: |
          echo "=== Coverage Summary (lib-only) ==="
          if [ -f rust-services/lcov.info ]; then
            total=$(grep -E "^LF:" rust-services/lcov.info | awk '{sum+=$2} END {print sum}')
            hit=$(grep -E "^LH:" rust-services/lcov.info | awk '{sum+=$2} END {print sum}')
            if [ -n "$total" ] && [ "$total" -gt 0 ]; then
              pct=$(awk "BEGIN {printf \"%.2f\", ($hit/$total)*100}")
              echo "Overall line coverage: ${pct}%"
              threshold=49.0
              if (( $(echo "$pct < $threshold" | bc -l) )); then
                echo "⚠️  Coverage ${pct}% di bawah threshold ${threshold}% — gagal"
                exit 1
              else
                echo "✓ Coverage ${pct}% ≥ threshold ${threshold}% — PASS"
              fi
            fi
          fi

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: rust-services/lcov.info
          retention-days: 7

  # ── Cargo Audit (security — CVE scan) ──────────────────────────────────
  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-services
          cache-on-failure: true
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      - name: Audit Cargo.lock for CVEs
        working-directory: rust-services
        run: cargo audit --deny warnings

  # ── Cargo Deny (license compliance) ────────────────────────────────────
  cargo-deny:
    name: Cargo Deny (license)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-services
          cache-on-failure: true
      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny
      - name: Check licenses
        working-directory: rust-services
        run: cargo deny check licenses
