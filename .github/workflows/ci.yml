name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  schedule:
    # Weekly: setiap Senin jam 06:00 UTC — cargo audit + cargo deny
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Check: format + clippy + build ───────────────────────────────────────
  check:
    name: Check (fmt + clippy + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-services
          cache-on-failure: true

      - name: Check formatting
        working-directory: rust-services
        run: cargo fmt --all -- --check

      - name: Clippy (warnings as errors)
        working-directory: rust-services
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build workspace (dev profile)
        working-directory: rust-services
        run: cargo build --workspace

  # ── Unit tests (tanpa DB) ─────────────────────────────────────────────────
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-services
          cache-on-failure: true

      - name: Run unit tests (lib only — tanpa integration tests)
        working-directory: rust-services
        run: cargo test --workspace --lib
        env:
          APP_ENV: development

  # ── Bun check (notification service) ──────────────────────────────────────
  bun-check:
    name: Bun Check (notification service)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: bun-notification-service
        run: bun install --frozen-lockfile

      - name: Run tests
        working-directory: bun-notification-service
        run: bun test

  # ── Docker build check ────────────────────────────────────────────────────
  docker-build-check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: check
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main' || github.ref == 'refs/heads/develop' || github.base_ref == 'develop'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build rejki-app image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./rust-services
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build bun-notification image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./bun-notification-service
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Coverage (cargo-llvm-cov, lib-only, tanpa DB) ──────────────────────────
  coverage:
    name: Coverage (lib-only)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-services
          cache-on-failure: true

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run coverage (lib only — tanpa integration)
        working-directory: rust-services
        run: cargo llvm-cov --workspace --lib --lcov --output-path lcov.info
        env:
          APP_ENV: development

      - name: Report coverage summary
        run: |
          echo "=== Coverage Summary (lib-only) ==="
          if [ -f rust-services/lcov.info ]; then
            total=$(grep -E "^LF:" rust-services/lcov.info | awk '{sum+=$2} END {print sum}')
            hit=$(grep -E "^LH:" rust-services/lcov.info | awk '{sum+=$2} END {print sum}')
            if [ -n "$total" ] && [ "$total" -gt 0 ]; then
              pct=$(awk "BEGIN {printf \"%.2f\", ($hit/$total)*100}")
              echo "Overall line coverage: ${pct}%"
              # Soft gate bertahap (Ops A — design D9). Target final: ≥85%.
              # Threshold naik dari baseline 17.90% → 49.09% (post ws-testing-coverage roll-out).
              threshold=49.0
              if (( $(echo "$pct < $threshold" | bc -l) )); then
                echo "⚠️  Coverage ${pct}% di bawah threshold ${threshold}% — gagal"
                exit 1
              else
                echo "✓ Coverage ${pct}% ≥ threshold ${threshold}% — PASS"
              fi
            fi
          fi

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: rust-services/lcov.info
          retention-days: 7

  # ── Cargo Audit (security — CVE scan) ──────────────────────────────────
  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    # Hanya jalan saat schedule event — tidak perlu blocking PR (terlalu berisik)
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-services
          cache-on-failure: true

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Audit Cargo.lock for CVEs
        working-directory: rust-services
        # Fail on CRITICAL dan HIGH — ignore warnings (informational/low/medium)
        run: cargo audit --deny warnings

  # ── Cargo Deny (license compliance) ────────────────────────────────────
  cargo-deny:
    name: Cargo Deny (license)
    runs-on: ubuntu-latest
    # Hanya jalan saat schedule event — tidak perlu blocking PR (terlalu berisik)
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-services
          cache-on-failure: true

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Check licenses (reject GPL/AGPL)
        working-directory: rust-services
        # deny.toml ada di rust-services/ — cargo-deny auto-detect
        run: cargo deny check licenses
