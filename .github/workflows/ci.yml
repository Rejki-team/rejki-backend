name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  schedule:
    # Weekly: setiap Senin jam 06:00 UTC — cargo audit + cargo deny
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Check: format + clippy + build ───────────────────────────────────────
  check:
    name: Check (fmt + clippy + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-services
          cache-on-failure: true

      - name: Check formatting
        working-directory: rust-services
        run: cargo fmt --all -- --check

      - name: Clippy (warnings as errors)
        working-directory: rust-services
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build workspace (dev profile)
        working-directory: rust-services
        run: cargo build --workspace

  # ── Unit tests (tanpa DB) ─────────────────────────────────────────────────
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-services
          cache-on-failure: true

      - name: Run unit tests (lib only — tanpa integration tests)
        working-directory: rust-services
        run: cargo test --workspace --lib
        env:
          APP_ENV: development

  # ── Integration tests (dengan PostgreSQL nyata) ───────────────────────────
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: check

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER:     rejki_test
          POSTGRES_PASSWORD: rejki_test
          POSTGRES_DB:       rejki_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rejki_test -d rejki_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-services
          cache-on-failure: true

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres

      - name: Generate RSA key pair untuk JWT test
        run: |
          mkdir -p rust-services/rejki-app/keys
          openssl genrsa -out rust-services/rejki-app/keys/private.pem 2048
          openssl rsa -in rust-services/rejki-app/keys/private.pem -pubout -out rust-services/rejki-app/keys/public.pem

      - name: Run all service migrations (dynamic — from migrations/ folders)
        env:
          PGPASSWORD: rejki_test
        run: |
          export DATABASE_URL="postgres://rejki_test:rejki_test@localhost:5432/rejki_test"

          # Map service directory → PostgreSQL schema name
          # Most follow: strip "-service", replace "-" → "_"
          # Exceptions: user-service→user_svc, corporate-comms-service→comms
          map_schema() {
            case "$1" in
              user-service)            echo "user_svc" ;;
              corporate-comms-service) echo "comms" ;;
              *)                       echo "$1" | sed 's/-service//' | sed 's/-/_/g' ;;
            esac
          }

          for dir in rust-services/*-service/migrations; do
            svc=$(basename "$(dirname "$dir")")
            schema=$(map_schema "$svc")
            echo "==> Schema: $schema (from $svc)"
            psql -h localhost -U rejki_test -d rejki_test -c "CREATE SCHEMA IF NOT EXISTS $schema"
            sqlx migrate run --source "$dir" --database-url "$DATABASE_URL"
          done

      - name: Run integration tests (all files)
        working-directory: rust-services
        run: cargo test --workspace --test '*' -- --test-threads=1
        env:
          APP_ENV:              development
          DATABASE_URL:         postgres://rejki_test:rejki_test@localhost:5432/rejki_test
          REDIS_URL:            ""
          APP_PORT:             "0"
          SERVICE_NAME:         rejki-test
          JWT_PRIVATE_KEY_PATH: ./keys/private.pem
          JWT_PUBLIC_KEY_PATH:  ./keys/public.pem
          JWT_ACCESS_TTL_SECS:  "900"

  # ── Docker build check ────────────────────────────────────────────────────
  docker-build-check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: check
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build rejki-app image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./rust-services
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build bun-notification image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./bun-notification-service
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Coverage (cargo-llvm-cov, soft gate) ──────────────────────────────────
  coverage:
    name: Coverage (soft gate)
    runs-on: ubuntu-latest
    needs: check

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER:     rejki_test
          POSTGRES_PASSWORD: rejki_test
          POSTGRES_DB:       rejki_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rejki_test -d rejki_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-services
          cache-on-failure: true

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov

      - name: Generate RSA key pair untuk JWT test
        run: |
          mkdir -p rust-services/rejki-app/keys
          openssl genrsa -out rust-services/rejki-app/keys/private.pem 2048
          openssl rsa -in rust-services/rejki-app/keys/private.pem -pubout -out rust-services/rejki-app/keys/public.pem

      - name: Run all service migrations
        env:
          PGPASSWORD: rejki_test
        run: |
          export DATABASE_URL="postgres://rejki_test:rejki_test@localhost:5432/rejki_test"
          map_schema() {
            case "$1" in
              user-service)            echo "user_svc" ;;
              corporate-comms-service) echo "comms" ;;
              *)                       echo "$1" | sed 's/-service//' | sed 's/-/_/g' ;;
            esac
          }
          for dir in rust-services/*-service/migrations; do
            svc=$(basename "$(dirname "$dir")")
            schema=$(map_schema "$svc")
            echo "==> Schema: $schema (from $svc)"
            psql -h localhost -U rejki_test -d rejki_test -c "CREATE SCHEMA IF NOT EXISTS $schema"
          done

      - name: Run coverage (lib + integration)
        working-directory: rust-services
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
        env:
          APP_ENV:              development
          DATABASE_URL:         postgres://rejki_test:rejki_test@localhost:5432/rejki_test
          REDIS_URL:            ""
          APP_PORT:             "0"
          SERVICE_NAME:         rejki-test
          JWT_PRIVATE_KEY_PATH: ./keys/private.pem
          JWT_PUBLIC_KEY_PATH:  ./keys/public.pem
          JWT_ACCESS_TTL_SECS:  "900"

      - name: Report coverage summary
        run: |
          echo "=== Coverage Summary ==="
          if [ -f rust-services/lcov.info ]; then
            total=$(grep -E "^LF:" rust-services/lcov.info | awk '{sum+=$2} END {print sum}')
            hit=$(grep -E "^LH:" rust-services/lcov.info | awk '{sum+=$2} END {print sum}')
            if [ -n "$total" ] && [ "$total" -gt 0 ]; then
              pct=$(awk "BEGIN {printf \"%.2f\", ($hit/$total)*100}")
              echo "Overall line coverage: ${pct}%"
              # Soft gate bertahap (Ops A — design D9). Target final: ≥85%.
              # Threshold naik dari baseline 17.90% → 49.09% (post ws-testing-coverage roll-out).
              threshold=49.0
              if (( $(echo "$pct < $threshold" | bc -l) )); then
                echo "⚠️  Coverage ${pct}% di bawah threshold ${threshold}% — gagal"
                exit 1
              else
                echo "✓ Coverage ${pct}% ≥ threshold ${threshold}% — PASS"
              fi
            fi
          fi

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: rust-services/lcov.info
          retention-days: 7

  # ── Cargo Audit (security — CVE scan) ──────────────────────────────────
  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    # Hanya jalan saat schedule event — tidak perlu blocking PR (terlalu berisik)
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-services
          cache-on-failure: true

      - name: Install cargo-audit
        working-directory: rust-services
        run: cargo install cargo-audit

      - name: Audit Cargo.lock for CVEs
        working-directory: rust-services
        # Fail on CRITICAL dan HIGH — ignore warnings (informational/low/medium)
        run: cargo audit --deny warnings

  # ── Cargo Deny (license compliance) ────────────────────────────────────
  cargo-deny:
    name: Cargo Deny (license)
    runs-on: ubuntu-latest
    # Hanya jalan saat schedule event — tidak perlu blocking PR (terlalu berisik)
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-services
          cache-on-failure: true

      - name: Install cargo-deny
        working-directory: rust-services
        run: cargo install cargo-deny

      - name: Check licenses (reject GPL/AGPL)
        working-directory: rust-services
        # deny.toml ada di rust-services/ — cargo-deny auto-detect
        run: cargo deny check licenses
