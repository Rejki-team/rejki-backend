# ─────────────────────────────────────────────────────────────────────────────
# Rejki Backend — nginx development config
# Digunakan oleh docker compose untuk development lokal.
# HTTPS ditangani Cloudflare (production) atau tidak diperlukan (development).
# ─────────────────────────────────────────────────────────────────────────────

upstream rejki_app {
    server rejki-app:8080;
    keepalive 32;
}

upstream rejki_web {
    server rejki-web:80;
}

upstream bun_notification {
    server rejki-bun-notification:9000;
}

server {
    listen 80;
    server_name dev.rejki.id localhost;

    # ── Logging ──────────────────────────────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ── Security headers (development — lebih longgar dari production) ────────
    add_header X-Content-Type-Options  "nosniff"         always;
    add_header X-Frame-Options         "DENY"            always;
    add_header Referrer-Policy         "strict-origin"   always;

    # ── Limits ───────────────────────────────────────────────────────────────
    client_max_body_size 10m;

    # ── Health check nginx sendiri ────────────────────────────────────────────
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── Health check aplikasi (no auth, no log) ───────────────────────────────
    location = /health {
        access_log off;
        proxy_pass         http://rejki_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── WebSocket — chat service ──────────────────────────────────────────────
    # PENTING: jangan log URL ini karena mengandung ?token= query param
    location /api/v1/chat/ws {
        access_log off;

        proxy_pass         http://rejki_app;
        proxy_http_version 1.1;

        # Header wajib untuk WebSocket upgrade
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeout untuk WebSocket long-lived connection
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_connect_timeout 5s;
    }

    # ── REST API utama ────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://rejki_app;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Timeout standar REST
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }

    # ── Frontend (Vue 3 SPA) ──────────────────────────────────────────────────
    # Semua request non-API diteruskan ke rejki-web (internal nginx)
    location / {
        proxy_pass         http://rejki_web;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;

        # Cache static assets
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            proxy_pass http://rejki_web;
        }
    }
}
