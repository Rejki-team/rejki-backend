# ─────────────────────────────────────────────────────────────────────────────
# Rejki Backend — Docker Compose (Base Infrastructure)
# Service images di-push ke GHCR oleh GitHub Actions CI
# Server hanya pull & up -d
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: rejki-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     rejki
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?err_PGPASSWORD_wajib_di_set}
      POSTGRES_DB:       rejki_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rejki -d rejki_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: rejki-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal

  # ── MinIO (S3-compatible object storage) ───────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: rejki-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ACCESS_KEY:-rejkiadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?err_MINIO_SECRET_wajib_di_set}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - internal

  # ── ClamAV (Virus scan engine) ────────────────────────────────────────────
  clamav-daemon:
    image: clamav/clamav:stable
    container_name: rejki-clamav
    restart: unless-stopped
    environment:
      CLAMAV_NO_FRESHCLAMD: "false"
    volumes:
      - clamav-db:/var/lib/clamav
    expose:
      - "3310"
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/clamav/clamd.ctl || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - internal

# ── Volumes ────────────────────────────────────────────────────────────────
volumes:
  pgdata:
  redisdata:
  miniodata:
  clamav-db:

# ── Networks ───────────────────────────────────────────────────────────────
networks:
  internal:
    driver: bridge
