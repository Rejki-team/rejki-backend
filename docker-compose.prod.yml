# ─────────────────────────────────────────────────────────────────────────────
# Rejki Backend — Production Environment
# Berbagi PostgreSQL + Redis + MinIO dari docker-compose.infra.yml
# Jalan di project name: rejki-prod
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── Rejki App (Rust — Modular Monolith) ────────────────────────────────────
  rejki-app:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-rejki-team}/rejki-backend:main
    container_name: rejki-app-prod
    restart: unless-stopped
    # depends_on postgres & redis ada di docker-compose.infra.yml (project terpisah)
    # — container connect via shared network rejki-infra
    environment:
      APP_ENV:               production
      DATABASE_URL:          postgres://rejki:${POSTGRES_PASSWORD:?err_PGPASSWORD_wajib_di_set}@postgres:5432/rejki_prod
      DATABASE_POOL_SIZE:    ${DATABASE_POOL_SIZE:-20}
      REDIS_URL:             redis://redis:6379/1
      APP_PORT:              8080
      CORS_ALLOWED_ORIGINS:  ${CORS_ALLOWED_ORIGINS:-https://rejki.id,https://app.rejki.id}
      JWT_PRIVATE_KEY_PATH:  /app/keys/private.pem
      JWT_PUBLIC_KEY_PATH:   /app/keys/public.pem
      JWT_ACCESS_TTL_SECS:   ${JWT_ACCESS_TTL_SECS:-900}
      JWT_REFRESH_TTL_SECS:  ${JWT_REFRESH_TTL_SECS:-2592000}
      DATA_ENCRYPTION_KEY:   ${DATA_ENCRYPTION_KEY}
      RUST_LOG:              ${RUST_LOG:-warn}
      MINIO_ENDPOINT:        http://minio:9000
      MINIO_ACCESS_KEY:      ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY:      ${MINIO_SECRET_KEY}
      MINIO_BUCKET:          rejki-dokumen-prod
      CLAMAV_HOST:           clamav-daemon
      CLAMAV_PORT:           3310
      OTEL_SERVICE_NAME:     rejiki-backend-prod
      OTEL_EXPORTER_OTLP_ENDPOINT: http://rejki-otel-collector:4317
      OTEL_EXPORTER_OTLP_HEADERS:  ${OTEL_EXPORTER_OTLP_HEADERS:-}
    volumes:
      - /opt/rejki/keys:/app/keys:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - rejki-infra
      - rejki-prod

  # ── Bun Notification Service ───────────────────────────────────────────────
  bun-notification:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-rejki-team}/rejki-backend-notification:main
    container_name: rejki-bun-prod
    restart: unless-stopped
    # depends_on postgres & redis ada di docker-compose.infra.yml (project terpisah)
    environment:
      APP_ENV:                      production
      REDIS_URL:                    redis://redis:6379/1
      DATABASE_URL:                 postgres://rejki:${POSTGRES_PASSWORD:?err_PGPASSWORD_wajib_di_set}@postgres:5432/rejki_prod
      FIREBASE_SERVICE_ACCOUNT_PATH: /app/keys/firebase-service-account-prod.json
      FIREBASE_PROJECT_ID:          ${FIREBASE_PROJECT_ID_PROD}
      SMTP_HOST:                    ${SMTP_HOST}
      SMTP_PORT:                    ${SMTP_PORT:-587}
      SMTP_USERNAME:                ${SMTP_USERNAME}
      SMTP_PASSWORD:                ${SMTP_PASSWORD}
      EMAIL_FROM:                   ${EMAIL_FROM:-Rejki <noreply@rejki.id>}
      PORT:                         9000
    volumes:
      - /opt/rejki/keys:/app/keys:ro
    expose:
      - "9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    networks:
      - rejki-infra
      - rejki-prod

  # ── Rejki Web (Vue 3 Frontend) ────────────────────────────────────────────
  rejki-web:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-rejki-team}/rejki-web:main
    container_name: rejki-web-prod
    restart: unless-stopped
    depends_on:
      - rejki-app
    expose:
      - "80"
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M
    networks:
      - rejki-prod

  # ── Nginx (Reverse Proxy) — PROD ──────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: rejki-nginx-prod
    restart: unless-stopped
    depends_on:
      - rejki-app
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8082:80"   # Prod di port 8082 (localhost only, via cloudflare tunnel)
    deploy:
      resources:
        limits:
          memory: 32M
        reservations:
          memory: 16M
    networks:
      - rejki-prod

  # ── DB Backup ─────────────────────────────────────────────────────────────
  db-backup:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-rejki-team}/rejki-backup:main
    container_name: rejki-db-backup
    restart: unless-stopped
    # depends_on postgres & minio ada di docker-compose.infra.yml (project terpisah)
    environment:
      PGUSER:               rejki
      PGPASSWORD:           ${POSTGRES_PASSWORD:?err_PGPASSWORD_wajib_di_set}
      PGDATABASE:           rejki_prod
      PGHOST:               postgres
      MINIO_ENDPOINT:       http://minio:9000
      MINIO_ACCESS_KEY:     ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY:     ${MINIO_SECRET_KEY}
      S3_BACKUP_BUCKET:     rejki-backups
      BACKUP_SCHEDULE:      ${BACKUP_SCHEDULE:-0 3 * * *}
    volumes:
      - backup-data:/backups
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - rejki-infra
      - rejki-prod

  # ── Cloudflare Tunnel (production only) ────────────────────────────────────
  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: rejki-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?err}
    depends_on:
      - nginx
    networks:
      - rejki-prod
    profiles:
      - prod

volumes:
  backup-data:

networks:
  rejki-infra:
    name: rejki-infra
    external: true
  rejki-prod:
    name: rejki-prod
    driver: bridge
